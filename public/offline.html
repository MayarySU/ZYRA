<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Sin conexión · ZYRA</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #000000;
        color: #ededed;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        width: 100%;
        text-align: center;
        background: #0a0a0a;
        border: 1px solid #1f1f1f;
        border-radius: 20px;
        padding: 40px 28px;
      }
      .logo {
        font-weight: 900;
        letter-spacing: -0.06em;
        font-size: 28px;
        margin: 0 0 8px;
      }
      .logo span { color: #f59e0b; }
      .icon {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        color: #f59e0b;
      }
      h1 { font-size: 18px; margin: 0 0 8px; }
      p { color: #a3a3a3; font-size: 14px; line-height: 1.6; margin: 0 0 24px; }
      button {
        appearance: none;
        border: 0;
        cursor: pointer;
        background: #f59e0b;
        color: #000;
        font-weight: 700;
        font-size: 14px;
        padding: 12px 22px;
        border-radius: 9999px;
        width: 100%;
      }
      button:active { transform: scale(0.98); }
    </style>
  </head>
  <body>
    <main class="card">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M1 1l22 22" />
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9" />
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
        <line x1="12" y1="20" x2="12.01" y2="20" />
      </svg>
      <p class="logo">ZY<span>RA</span></p>
      <h1>Sin conexión</h1>
      <p>
        No hay red en este momento. Tus cambios se están guardando en el
        dispositivo y se sincronizarán automáticamente al reconectar.
      </p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
